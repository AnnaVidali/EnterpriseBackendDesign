spring:
  application:
    name: enterprise-backend-design

  datasource:
    url: jdbc:postgresql://localhost:5433/enterprise_db
    username: ${DB_USERNAME:enterprise}
    password: ${DB_PASSWORD:enterprise}
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: never

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: ${SERVER_PORT:8080}

app:
  kafka:
    topics:
      partitions: 1
      replication-factor: 1
  jwt:
    secret: ${JWT_SECRET:4A6F5B6D7C8E9F0A1B2C3D4E5F6A7B8C9D0E1F2A3B4C5D6E7F8A9B0C1D2E3F}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

payment:
  gateway:
    stripe:
      api-key: ${STRIPE_API_KEY:sk_test_dummy}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
