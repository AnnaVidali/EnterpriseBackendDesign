spring:
  application:
    name: enterprise-backend-design

  datasource:
    url: jdbc:postgresql://localhost:5432/enterprise_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:4A6F5B6D7C8E9F0A1B2C3D4E5F6A7B8C9D0E1F2A3B4C5D6E7F8A9B0C1D2E3F}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

payment:
  gateway:
    stripe:
      api-key: ${STRIPE_API_KEY:sk_test_dummy}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
